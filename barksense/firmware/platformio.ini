; BarkSense — XIAO ESP32S3 Sense
; PlatformIO Project Configuration File

[env:seeed_xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

; 8 MB flash — larger app partition so TFLite Micro fits
board_build.partitions = huge_app.csv
; OPI PSRAM (8 MB) — tensor arena and mel filterbank go here
board_build.arduino.memory_type = qio_opi

lib_deps =
    ; ESP32-Arduino port of TFLite Micro. The upstream
    ; tflite-micro-arduino-examples ships nRF52840-specific peripherals/ that
    ; won't compile here.
    tanakamasayuki/TensorFlowLite_ESP32 @ ^1.0.0

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -O2
    -std=gnu++17
    -Wno-unused-variable
    -Wno-unused-function
    ; Uncomment to compile the one-shot feature-extraction self-test in place of
    ; the normal loop. Test fixture (audio + expected tensor) is embedded via
    ; firmware/include/test_data.h, generated by scripts/export_test_feature.py.
    -DFEATURE_TEST

build_unflags =
    -std=gnu++11
    -std=gnu++14
